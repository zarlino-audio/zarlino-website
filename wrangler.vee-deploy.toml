# Identical to wrangler.toml except the assets directory is a frozen build
# (another process in this workspace keeps rebuilding ./dist, which would race).
# Deploy with:  npx -y wrangler@4 deploy --config wrangler.vee-deploy.toml
name = "zarlino-website"
main = "src/index.ts"
