name = "zarlino-website"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# READ BEFORE EDITING — this block is load-bearing for the 1101 fix.
#
# binding = "ASSETS"
#   Without it, `env.ASSETS` is UNDEFINED inside the Worker. The Worker used to
#   crash (TypeError -> Cloudflare 1101) on every path that is not a direct
#   asset, including every unknown path. The binding is what makes
#   `env.ASSETS.fetch()` (and the readiness probe) work.
#
# run_worker_first = ["/api/*", "/releases/*"]
#   Page requests are served by the platform asset router and NEVER reach the
#   Worker — an unknown page therefore returns the custom 404 page (HTTP 404),
#   structurally incapable of producing a 1101. The Worker runs for /api/*
#   (the dynamic surface) and /releases/* (verified release assets streamed
#   from the private R2 bucket — see routes/contract.json).
#
# not_found_handling = "404-page"
#   Unknown page paths are answered with /404.html and an exact HTTP 404.
[assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = ["/api/*", "/releases/*"]

# ---------------------------------------------------------------------------
# Plugin Factory customer stores (Durable Object + embedded SQLite).
#
#   FACTORY_IDENTITY   one instance ("global"): accounts, sessions, plans,
#                      payment events, rate limits, funnel analytics.
#   FACTORY_WORKSPACE  one instance PER CUSTOMER, addressed as "user:<id>" from
#                      the authenticated session. Cross-customer access is
#                      structurally impossible: no request can address another
#                      customer's object.
#
# The migration tag records the class registration; `new_sqlite_classes` gives
# each object its own storage with SQL, run through src/factory/do-sql.ts.
[durable_objects]
bindings = [
  { name = "FACTORY_IDENTITY", class_name = "FactoryIdentity" },
  { name = "FACTORY_WORKSPACE", class_name = "FactoryWorkspace" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FactoryIdentity", "FactoryWorkspace"]

[vars]
# Base URL of the build orchestrator (Executive OS). The factory gateway secret
# is a Worker SECRET: wrangler secret put FACTORY_GATEWAY_SECRET.
FACTORY_OS_URL = "https://os.zarlinoaudio.com"
FACTORY_PUBLIC_URL = "https://zarlinoaudio.com"
# Token for the /admin dashboard (GET /api/admin/stats). Rotate to a
# different value and set as a Worker secret if you want it out of git.
# ADMIN_TOKEN is a Worker SECRET now (wrangler secret put ADMIN_TOKEN).
# Rotated 2026-09-29: the old literal was committed to this public repo and is
# treated as compromised — never add a token value in this file again.

# Paystack checkout — public key is safe in git (client-side). The SECRET key
# must NOT go in this file: set it with:
#   wrangler secret put PAYSTACK_SECRET_KEY
# This account is GHS-only (balance is in Ghana Cedis). To bill USD/NGN later,
# enable those currencies on the Paystack dashboard and change this value.
PAYSTACK_PUBLIC_KEY = "pk_live_d2f7554900d64fa3ae9b334777c815e8b346f885"
PAYSTACK_CURRENCY = "GHS"

# KV namespace for page-view/license counters AND the affiliate program
# (applications, referral codes, click/conversion tracking). Created with:
#   wrangler kv namespace create ZARLINO_KV
[[kv_namespaces]]
binding = "ZARLINO_KV"
id = "66bc47e33fe145f697cf1f80912f269e"

# Verified release storage (R2, private bucket; founder decision 2026-10-12).
# Release assets (binaries, canonical screenshot, canonical audio, manifest)
# are published by the plugin release gate and served EXCLUSIVELY through this
# Worker at /releases/<product>/latest/... - the bucket has no public access.
[[r2_buckets]]
binding = "RELEASES"
bucket_name = "zarlino-releases"

# ---------------------------------------------------------------------------
# Plugin Factory build artifacts (private bucket `zarlino-artifacts`).
# The factory build workflow uploads qa-report.json, build-record.json and the
# packaged VST3 under `factory-builds/<buildId>/`. This Worker reads them back
# ONLY after the customer-side download gate passes (owner + READY + QA pass +
# retention), and only for keys under `factory-builds/`.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "FACTORY_ARTIFACTS"
bucket_name = "zarlino-artifacts"

[observability]
enabled = true
