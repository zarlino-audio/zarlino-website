name = "zarlino-website"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"

[vars]
# Token for the /admin dashboard (GET /api/admin/stats). Rotate to a
# different value and set as a Worker secret if you want it out of git.
ADMIN_TOKEN = "PGRUxCidKulFTgLsIE3jJhON079BwD8t"

# KV namespace for page-view/license counters AND the affiliate program
# (applications, referral codes, click/conversion tracking). Created with:
#   wrangler kv namespace create ZARLINO_KV
[[kv_namespaces]]
binding = "ZARLINO_KV"
id = "66bc47e33fe145f697cf1f80912f269e"

[observability]
enabled = true
