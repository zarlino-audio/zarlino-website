name: Post-Deploy Acceptance Gate

# PRODUCTION VERIFICATION — the authoritative external acceptance of
# https://zarlinoaudio.com. This is a SEPARATE workflow from the deploy on
# purpose (see deploy.yml):
#
#   BUILD SUCCESS  != DEPLOY SUCCESS != PRODUCTION VERIFIED
#
#   - workflow_run: fires after "Deploy to Cloudflare Workers" COMPLETES
#     SUCCESSFULLY on main, so probes run against the freshly deployed build.
#     The triggering run's head_sha is the INTENDED production SHA; the gate
#     requires /api/health on production to report exactly that commit, or the
#     verdict is PRODUCTION_DRIFT (never a pass).
#   - schedule: nightly safety sweep against current main (github.sha). Catches
#     drift, serving flaps and outages with NO deploy involved.
#   - workflow_dispatch: manual run; expected_sha defaults to the selected ref.
#
# Exit codes from scripts/post-deploy-check.mjs:
#   0 VERIFIED · 1 FAILED · 3 DRIFT/UNKNOWN · 4 NON_DETERMINATE

on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
    branches: [main]
  schedule:
    # 03:17 UTC nightly (off-peak, well after any deploy window)
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to probe (default https://zarlinoaudio.com)"
        required: false
        default: "https://zarlinoaudio.com"
      expected_sha:
        description: "Git SHA production must report (default: current ref)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: post-deploy-acceptance
  cancel-in-progress: false

jobs:
  accept:
    name: Production acceptance
    # Only verify a deploy that actually completed successfully; a failed
    # deploy is a deployment failure, not a production regression.
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://zarlinoaudio.com' }}
      # Intended production identity:
      #  - workflow_run: the commit the deploy built (head_sha)
      #  - schedule/dispatch: the checked-out ref's SHA (github.sha = main HEAD)
      EXPECTED_SHA: ${{ github.event.inputs.expected_sha || github.event.workflow_run.head_sha || github.sha }}
      EXPECTED_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      REQUEST_TIMEOUT_MS: "15000"
      IDENTITY_WAIT_MS: "60000"
      # Flap rule: a route may only be PASS/FAIL after 3 identical sweeps.
      FLAP_CONSECUTIVE_N: "3"
      SWEEP_DELAY_MS: "5000"

    steps:
      - name: Checkout (the deployed tree)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # THE GATE. Capture the exit code so the acceptance record can ALWAYS be
      # uploaded, then re-exit with it so the job fails loudly on any non-
      # VERIFIED verdict.
      - name: Run acceptance gate (contract + production identity)
        id: gate
        shell: bash
        run: |
          set +e
          node scripts/post-deploy-check.mjs 2>&1 | tee gate-output.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Gate exit code: $code"
          set -e

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Post-Deploy Acceptance Gate"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| BASE_URL | \`${{ env.BASE_URL }}\` |"
            echo "| expected SHA | \`${{ env.EXPECTED_SHA }}\` |"
            echo "| exit code | \`${{ steps.gate.outputs.exit_code }}\` |"
            echo ""
            echo '```'
            tail -n 30 gate-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ACCEPTANCE RECORD — the citable artifact: intended SHA, observed
      # production SHA, sweep timestamps, per-route results, verdict.
      - name: Upload acceptance record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-acceptance
          if-no-files-found: warn
          retention-days: 90
          path: |
            scripts/.post-deploy-check-acceptance.json
            gate-output.txt

      - name: Enforce verdict
        shell: bash
        run: |
          code="${{ steps.gate.outputs.exit_code }}"
          if [ "$code" = "0" ]; then
            echo "Acceptance VERIFIED (exit 0): production serves the contract and reports the intended SHA."
            exit 0
          fi
          if [ "$code" = "3" ]; then
            echo "::error::Gate verdict DRIFT/UNKNOWN (exit 3): production does not report the"
            echo "::error::intended commit, or the intended commit was not provided. NO DEPLOY"
            echo "::error::=> NO FIX: a green subset on an unchanged (or unidentified) artifact"
            echo "::error::is never a pass."
            exit 3
          fi
          if [ "$code" = "4" ]; then
            echo "::error::Gate verdict NON_DETERMINATE (exit 4): observations diverged between"
            echo "::error::sweeps — serving flap. Never recorded as VERIFIED."
            exit 4
          fi
          echo "::error::Gate verdict FAILED (exit $code): one or more contract entries failed."
          exit "$code"
